apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-frontend
  namespace: secureops
  labels:
    app: secureops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secureops-frontend
  template:
    metadata:
      labels:
        app: secureops-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: gke-secureops-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
