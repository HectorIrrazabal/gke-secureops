apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend
  namespace: secureops
spec:
  podSelector:
    matchLabels:
      app: secureops-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: secureops-frontend
      ports:
        - protocol: TCP
          port: 8000
