apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureops-auditor-sa
  namespace: secureops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secureops-pod-reader
  namespace: secureops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secureops-auditor-binding
  namespace: secureops
subjects:
  - kind: ServiceAccount
    name: secureops-auditor-sa
    namespace: secureops
roleRef:
  kind: Role
  name: secureops-pod-reader
  apiGroup: rbac.authorization.k8s.io
