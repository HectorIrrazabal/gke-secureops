name: SecureOps CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: FastAPI + PostgreSQL Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secureops
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: secureops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureops -d secureops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: secureops
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: secureops
      RUN_DB_INTEGRATION_TESTS: "1"

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Initialize PostgreSQL schema
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U secureops -d secureops \
            < ../../database/init.sql

      - name: Run unit and integration tests
        run: python -m pytest tests/ -v
