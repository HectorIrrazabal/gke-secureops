name: SecureOps Container Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gke-secureops-backend:ci ./apps/backend

      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gke-secureops-backend:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

