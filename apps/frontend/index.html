<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GKE SecureOps</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      background: #f3f6fb;
      color: #172b4d;
    }
    main {
      max-width: 800px;
      margin: 48px auto;
      padding: 24px;
    }
    header, .panel {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px #0000000d;
    }
    h1 { margin-top: 0; }
    .status { font-weight: 600; color: #147d54; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GKE SecureOps</h1>
      <p>Secure Kubernetes Platform</p>
      <p>Backend: <span id="status">Consultando...</span></p>
      <p>Version API: <span id="version">-</span></p>
      <button onclick="loadOrders()">Actualizar pedidos</button>
    </header>

    <section class="panel">
      <h2>Pedidos</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="orders"></tbody>
      </table>
    </section>
  </main>

  <script>
    async function loadOrders() {
      const status = document.getElementById("status");
      const tbody = document.getElementById("orders");
      status.textContent = "Consultando...";
      tbody.replaceChildren();

      try {
        const response = await fetch("/api/orders", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        document.getElementById("version").textContent =
          data.version;
        status.textContent = "Conectado";
        status.className = "status";

        data.orders.forEach(order => {
          const row = document.createElement("tr");

          [order.id, order.product, order.status].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = String(value);
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });
      } catch (error) {
        status.textContent = "Error de conexion";
        status.className = "";
        document.getElementById("version").textContent = "-";
        console.error(error);
      }
    }

    loadOrders();
  </script>
</body>
</html>
